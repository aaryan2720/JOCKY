services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jocky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jocky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jocky_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-jocky_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jocky} -d ${POSTGRES_DB:-jocky_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Optional Task Queue / PubSub layer)
  redis:
    image: redis:7-alpine
    container_name: jocky-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Management Server
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: jocky-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jocky}:${POSTGRES_PASSWORD:-jocky_secure_password}@postgres:5432/${POSTGRES_DB:-jocky_db}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir backend

  # React Web Dashboard (Optional Dockerized dev server)
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: jocky-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  postgres_data:
  redis_data:
